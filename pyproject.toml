[project]
name = "ai-dnd-campaign-forge"
version = "0.6.3"
description = "Plugin-host desktop tool that forges D&D campaigns with LLM-backed generators."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Forge Contributors" }]
keywords = ["dnd", "ttrpg", "campaign", "generator", "llm", "plugin-host"]

dependencies = [
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.79"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
forge = "forge_host.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "forge_host",
    "forge_core",
    "forge_handlers",
    "forge_services",
    "forge_models",
    "forge_plugins",
    "forge_utils",
    "forge_config",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["forge_core", "forge_plugins/contracts.py", "forge_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"